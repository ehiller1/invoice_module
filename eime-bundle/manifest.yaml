# EIME bundle — root manifest
# Generated by design-bundle-orchestrator (Shape A — brownfield extraction).
# This is the development team's primary entry point: it inventories every file,
# declares the registry deltas staged for commit, and records open dependencies.

schema_version: 1.0
bundle_name: eime-bundle
module_id: eime
domain: ein.parish.financial_intelligence
category: parish_tier_agent
description: |
  EIME (Embark Invoice Mapping Engine) — parish-tier invoice-to-GL agent for
  EmbarkNow, sibling to Steward. Ingests invoices, maps line items to GL accounts
  with confidence scoring, drafts balanced journal entries under fund-accounting
  compliance, routes multi-tier HITL approvals, reconciles bank feeds, auto-posts
  recurring entries, and surfaces next-best-action advisory. Six-position guider
  cascade governs every outbound emission at mem.ein.parish.outer.

