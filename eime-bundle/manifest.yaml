# ========== RUNTIME DEPENDENCIES ==========
runtime_dependencies:
  memory_fabric_context_pack:
    required: true
    binding: context/fabric_bindings.yaml
    note: Context packs assembled by the parish memory fabric; consumed by intent router and agents.
  decision_matrix_evaluator:
    required: true
    binding: context/decision_matrix.yaml
    tools: tools/decision_matrix_tools.py
    note: Authority/disclosure verdict gate used by capture_flow + resolution_contract.
  agent_output_display:
    required: true
    emission_templates: interactions/emission_templates/
    tier: declarative
    emitting_agents:
      - invoice_extractor
      - expense_classifier
      - gl_account_mapper
      - risk_fraud_officer
      - journal_entry_builder
      - journal_entry_drafter
      - compliance_officer
      - hitl_gate_coordinator
      - reconciliation_specialist
      - autonomous_posting_engine
      - accounting_advisor
      - intent_router
  intent_router_runtime:
    required: true
    authoritative_source: events/intent_registry.yaml
    capture_flow: events/capture_flow.yaml
    resolution_contract: events/resolution_contract.yaml
  memory_stack_access:
    included: false
    note: Memory-stack shim not provisioned in this bundle; fabric presumed available at runtime.
  redis_mesh:
    required: true
    binding: mesh/mesh_config.yaml
    asyncapi: mesh/asyncapi.yaml
    envelope: mesh/event_envelope.schema.json

